<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KOMARO — 接続できません</title>
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --bg: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        /* WebViewでローカルファイルを開くと -apple-system は日本語へフォールバックせず
           豆腐（□）になるため、日本語フォントを明示してから総称名へ落とす */
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px calc(24px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
        -webkit-text-size-adjust: 100%;
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 {
        font-size: 20px;
        line-height: 1.5;
        margin: 0 0 12px;
        letter-spacing: 0.01em;
      }
      p {
        font-size: 15px;
        line-height: 1.8;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .hint {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        line-height: 1.8;
        color: var(--muted);
        text-align: left;
      }
      .hint ul {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      .hint li {
        margin-bottom: 4px;
      }
      button {
        appearance: none;
        border: 0;
        margin-top: 28px;
        width: 100%;
        padding: 16px 24px;
        border-radius: 12px;
        background: var(--ink);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f8fafc;
          --muted: #94a3b8;
          --line: #1e293b;
          --bg: #0b1220;
        }
        button {
          background: #f8fafc;
          color: #0b1220;
        }
        .logo {
          filter: invert(1);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="komaro-logo.png" alt="KOMARO" />
      <h1>ネットワークに接続できません</h1>
      <p>KOMARO は日程調整の回答をメンバー間で共有するため、通信が必要です。</p>
      <div class="hint">
        次をご確認ください：
        <ul>
          <li>機内モードがオンになっていないか</li>
          <li>Wi-Fi またはモバイル通信がつながっているか</li>
          <li>電波の届く場所にいるか</li>
        </ul>
      </div>
      <button type="button" onclick="location.replace('https://komaro.app/')">再読み込み</button>
    </main>
  </body>
</html>
